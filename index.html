<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSA Toolbox — Flight Utilities</title>
<meta name="description" content="ELIGRT's aviation tools — checklists, weight & balance, logbook, and flight planning.">
<meta property="og:title" content="LSA Toolbox — Flight Utilities">
<meta property="og:description" content="ELIGRT's aviation tools — checklists, weight & balance, logbook, and flight planning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://eligrt.github.io/">
<meta property="og:image" content="https://eligrt.github.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F4EEE1;
  --cream-2:#EDE4D3;
  --ink:#2B2620;
  --ink-soft:#5A5348;
  --gold:#C69A4A;
  --gold-deep:#A87C2E;
  --line:#DDD2BC;
  --card:#FBF7EE;
  --shadow:rgba(43,38,32,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Heebo',system-ui,sans-serif;
  min-height:100vh;
  line-height:1.5;
  padding:clamp(20px,5vw,64px) clamp(16px,5vw,48px);
}
.wrap{max-width:820px;margin:0 auto}

header{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:52px;
}
.brand{text-align:center}
.emblem{
  display:block;margin:0 auto 18px;
  width:clamp(120px,26vw,168px);height:auto;
}
h1{
  font-size:clamp(1.8rem,5vw,2.6rem);
  font-weight:800;letter-spacing:.02em;line-height:1.05;
  direction:ltr;
}
.tagline{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(.66rem,2vw,.74rem);
  letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold-deep);direction:ltr;
  margin-top:13px;padding-inline-start:.34em;
}
.sec-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);direction:ltr;
  display:flex;align-items:center;gap:12px;
  margin:0 0 16px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-label.second{margin-top:40px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.card{
  position:relative;
  display:flex;flex-direction:column;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px 20px;
  text-decoration:none;color:inherit;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:var(--gold);transform:scaleY(0);transform-origin:top;
  transition:transform .2s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 26px var(--shadow);
  border-color:var(--gold);
}
.card:hover::before{transform:scaleY(1)}
.card:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}

.card-top{display:flex;align-items:center;gap:14px}
.icon{
  width:50px;height:50px;flex:none;
  border-radius:12px;
  background:var(--cream-2);
  display:grid;place-items:center;
  border:1px solid var(--line);
  overflow:hidden;
}
.icon img{width:100%;height:100%;object-fit:cover}
.icon .glyph{font-size:1.45rem}
.tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-deep);direction:ltr;
  margin-inline-start:auto;
  border:1px solid var(--line);border-radius:20px;
  padding:3px 9px;white-space:nowrap;
}

/* consistent 3-line body: bold header → english → hebrew */
.card-body{display:flex;flex-direction:column;gap:4px}
.card h2{font-size:1.1rem;font-weight:700;line-height:1.2}
.card .en{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  color:var(--gold-deep);font-weight:500;direction:ltr;letter-spacing:.01em;
  text-align:right;
}
.card p{font-size:.85rem;color:var(--ink-soft);line-height:1.45;margin-top:2px}

.card .go{
  margin-top:auto;
  font-family:'Heebo',sans-serif;font-weight:500;
  font-size:.82rem;color:var(--gold-deep);
  display:flex;align-items:center;gap:6px;
}
.go .arr{transition:transform .18s ease;font-family:'IBM Plex Mono',monospace}
.card:hover .go .arr{transform:translateX(-4px)}

.grid.external .card{padding:18px 18px}

footer{
  margin-top:40px;padding-top:18px;
  border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;color:var(--ink-soft);
  direction:ltr;text-align:center;letter-spacing:.14em;opacity:.7;
}

footer{
  margin-top:44px;padding-top:20px;
  border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;color:var(--ink-soft);
  direction:ltr;text-align:center;letter-spacing:.06em;
}
footer a{color:var(--gold-deep);text-decoration:none}

@media (max-width:560px){
  body{padding:24px 14px}
  .grid,.grid.external{gap:11px}
  .card,.grid.external .card{padding:15px 13px;gap:9px;border-radius:12px}
  .icon{width:40px;height:40px;border-radius:10px}
  .icon .glyph{font-size:1.2rem}
  .tag{font-size:.55rem;padding:2px 7px;letter-spacing:.1em}
  .card h2{font-size:.95rem}
  .card .en{font-size:.62rem}
  .card p{font-size:.76rem}
  .card .go{font-size:.75rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img class="emblem" src="https://eligrt.github.io/emblem.png" alt="">
      <h1>LSA TOOLBOX</h1>
      <div class="tagline">Flight Utilities</div>
    </div>
  </header>

  <p class="sec-label">ELIGRT's Projects</p>
  <main class="grid" id="grid-own"></main>

  <p class="sec-label second">External links</p>
  <main class="grid external" id="grid-ext"></main>

  <footer>v1.19</footer>
</div>

<script>
const OWN = [
  {
    title:"AirCheck",
    en:"The checklist on top of the checklist",
    desc:"כל מה שלא נכנס לבד\"ח הרשמי, אבל חייבים להשלים לפני שממריאים (ואחרי שנוחתים...).",
    url:"https://eligrt.github.io/AirCheck/AirCheck_RD.html",
    icon:"https://eligrt.github.io/AirCheck/AirCheck_logo_RD.png",
    glyph:"✈", tag:"CHECKLIST"
  },
  {
    title:"Weight & Balance",
    en:"AirBalance — Texan 570 & Harmony",
    desc:"מחשבון משקל ואיזון לאז\"מ.",
    url:"https://eligrt.github.io/AirBalance/AirBalance.html",
    icon:"https://eligrt.github.io/AirBalance/WnB_Logo.jpg", glyph:"⚖", tag:"CALC"
  },
  {
    title:"AirLog",
    en:"Where aviation meets Google Sheet",
    desc:"הלוגבוק שלך מ-Google Sheet, בכף היד כאפליקציה (רישום טיסות, מעקב כשירות, סטטיסטיקות, יומן ועוד).",
    url:"https://eligrt.github.io/AirLog/AirLog.html",
    icon:"https://eligrt.github.io/AirLog/icon-512.png",
    glyph:"📖", tag:"LOGBOOK"
  },
  {
    title:"Merhav FPL",
    en:"Purple routes · AZAM",
    desc:"הגשת תוכנית ל\"טיסת מרחב\" בנתיבי אז\"ם דרומית לבאר שבע באמצ\"ש (\"נתיב סגול\").",
    url:"https://eligrt.github.io/MERHAV_fpl/PURPLE_Routes_AZAM.html",
    icon:"", glyph:"🟣", tag:"FPL"
  }
];

const EXT = [
  {
    title:"הגשת תוכנית טיסה",
    en:"fpl.co.il",
    url:"https://fpl.co.il/",
    glyph:"📋", tag:"FPL"
  },
  {
    title:"בדיקת נוטמים",
    en:"notam · Lior Ben-Horin",
    url:"https://notam.liorbenhorin.xyz/",
    glyph:"⚠", tag:"NOTAM"
  },
  {
    title:"מחשבון טיסה CX-3",
    en:"prepware.com",
    url:"https://prepware.com/cx3e/index.html",
    glyph:"➗", tag:"CALC"
  }
];

function cardHTML(t){
  const hasImg = t.icon && t.icon.length;
  return `
  <a class="card" href="${t.url}" target="_blank" rel="noopener">
    <div class="card-top">
      <span class="icon">
        ${hasImg?`<img src="${t.icon}" alt="" onerror="this.style.display='none';this.parentNode.querySelector('.glyph').style.display='block'">`:''}
        <span class="glyph"${hasImg?' style="display:none"':''}>${t.glyph||'✈'}</span>
      </span>
      <span class="tag">${t.tag}</span>
    </div>
    <div class="card-body">
      <h2>${t.title}</h2>
      ${t.en?`<span class="en">${t.en}</span>`:''}
      ${t.desc?`<p>${t.desc}</p>`:''}
    </div>
    <span class="go"><span class="arr">←</span> פתיחה</span>
  </a>`;
}

document.getElementById('grid-own').innerHTML = OWN.map(cardHTML).join('');
document.getElementById('grid-ext').innerHTML = EXT.map(cardHTML).join('');
</script>
</body>
</html>
